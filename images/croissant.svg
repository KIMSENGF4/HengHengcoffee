<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fbf1e2"/>
      <stop offset="1" stop-color="#e6cfb0"/>
    </radialGradient>
    <linearGradient id="dough" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b663"/>
      <stop offset=".55" stop-color="#d98a35"/>
      <stop offset="1" stop-color="#a95a1c"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5a14f"/>
      <stop offset="1" stop-color="#9c5018"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- plate -->
  <ellipse cx="300" cy="420" rx="250" ry="70" fill="#8a5a3a" opacity=".18" filter="url(#soft)"/>
  <ellipse cx="300" cy="400" rx="245" ry="64" fill="#fffdf9"/>
  <ellipse cx="300" cy="398" rx="200" ry="46" fill="none" stroke="#efe5d8" stroke-width="3"/>

  <!-- shadow under croissant -->
  <ellipse cx="300" cy="392" rx="190" ry="26" fill="#7a4a2a" opacity=".25" filter="url(#soft)"/>

  <g transform="translate(300 315)">
    <!-- tips -->
    <ellipse cx="-188" cy="52" rx="44" ry="24" transform="rotate(-38 -188 52)" fill="url(#tip)"/>
    <ellipse cx="188" cy="52" rx="44" ry="24" transform="rotate(38 188 52)" fill="url(#tip)"/>
    <!-- outer lobes -->
    <ellipse cx="-128" cy="12" rx="62" ry="50" transform="rotate(-30 -128 12)" fill="url(#dough)"/>
    <ellipse cx="128" cy="12" rx="62" ry="50" transform="rotate(30 128 12)" fill="url(#dough)"/>
    <!-- inner lobes -->
    <ellipse cx="-58" cy="-12" rx="70" ry="66" transform="rotate(-14 -58 -12)" fill="url(#dough)"/>
    <ellipse cx="58" cy="-12" rx="70" ry="66" transform="rotate(14 58 -12)" fill="url(#dough)"/>
    <!-- centre -->
    <ellipse cx="0" cy="-20" rx="62" ry="74" fill="url(#dough)"/>

    <!-- creases -->
    <g fill="none" stroke="#8a4512" stroke-width="5" stroke-linecap="round" opacity=".55">
      <path d="M-40 -88 Q-60 -20 -40 50"/>
      <path d="M40 -88 Q60 -20 40 50"/>
      <path d="M-104 -40 Q-128 10 -100 56"/>
      <path d="M104 -40 Q128 10 100 56"/>
      <path d="M-160 20 Q-170 50 -150 74"/>
      <path d="M160 20 Q170 50 150 74"/>
    </g>

    <!-- shine -->
    <g fill="#fff3d6" opacity=".55">
      <ellipse cx="-8" cy="-62" rx="26" ry="12" transform="rotate(-10 -8 -62)"/>
      <ellipse cx="-74" cy="-46" rx="20" ry="9" transform="rotate(-25 -74 -46)"/>
      <ellipse cx="64" cy="-48" rx="18" ry="8" transform="rotate(20 64 -48)"/>
      <ellipse cx="-138" cy="-14" rx="14" ry="6" transform="rotate(-35 -138 -14)"/>
      <ellipse cx="128" cy="-14" rx="14" ry="6" transform="rotate(35 128 -14)"/>
    </g>
  </g>

  <!-- flakes -->
  <g fill="#d98a35" opacity=".8">
    <ellipse cx="120" cy="430" rx="7" ry="3" transform="rotate(20 120 430)"/>
    <ellipse cx="470" cy="420" rx="6" ry="3" transform="rotate(-25 470 420)"/>
    <ellipse cx="440" cy="445" rx="4" ry="2"/>
    <ellipse cx="160" cy="448" rx="4" ry="2"/>
  </g>
</svg>
